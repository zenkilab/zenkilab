<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="amberFill" x1="8" y1="4" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC35C"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <style>
      @keyframes logo-ccw { to { transform: rotate(-360deg); } }
      @keyframes logo-cw { to { transform: rotate(360deg); } }
      .logo-ring-outer { transform-origin: 20px 20px; animation: logo-ccw 10s linear infinite; }
      .logo-ring-inner { transform-origin: 20px 20px; animation: logo-cw 7s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .logo-ring-outer, .logo-ring-inner { animation: none; }
      }
    </style>
  </defs>
  <circle cx="20" cy="20" r="18" fill="url(#amberFill)"/>
  <g class="logo-ring-outer">
    <circle cx="20" cy="20" r="17.1" stroke="#0B0D10" stroke-width="2" stroke-dasharray="10 8"/>
  </g>
  <g class="logo-ring-inner">
    <circle cx="20" cy="20" r="13.2" stroke="#38C8F5" stroke-width="2"/>
  </g>
  <path d="M14.5 13.5H25.5L14.5 26.5H25.5" stroke="#0B0D10" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
